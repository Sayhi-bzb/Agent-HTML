name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Select npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "value=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack @agent-html/react
        working-directory: packages/react
        run: npm pack --dry-run

      - name: Pack agent-html
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Publish @agent-html/react
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.value }} --provenance

      - name: Publish agent-html
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag ${{ steps.dist-tag.outputs.value }} --provenance
