[package]
name = "agent-html"
version = "0.0.1"
description = "Agent HTML desktop shell"
authors = ["Agent HTML"]
edition = "2021"

[lib]
name = "agent_html_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
