<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-app</title>
  </head>
  <body>
    <div id="root">
      <div class="app-startup-shell" data-app-startup-shell data-window-chrome-root>
        <div class="app-startup-surface" data-window-chrome-surface>
          <div class="app-startup-header">
            <span class="app-startup-skeleton app-startup-icon"></span>
            <span class="app-startup-skeleton app-startup-tab"></span>
            <span class="app-startup-skeleton app-startup-tab app-startup-tab-short"></span>
            <span class="app-startup-spacer"></span>
            <span class="app-startup-skeleton app-startup-control"></span>
            <span class="app-startup-skeleton app-startup-control"></span>
            <span class="app-startup-skeleton app-startup-control"></span>
          </div>
          <div class="app-startup-main">
            <aside class="app-startup-sidebar">
              <span class="app-startup-skeleton app-startup-sidebar-title"></span>
              <span class="app-startup-skeleton app-startup-sidebar-row"></span>
              <span class="app-startup-skeleton app-startup-sidebar-row"></span>
              <span class="app-startup-skeleton app-startup-sidebar-row app-startup-sidebar-row-short"></span>
              <span class="app-startup-sidebar-gap"></span>
              <span class="app-startup-skeleton app-startup-sidebar-title"></span>
              <span class="app-startup-skeleton app-startup-sidebar-row"></span>
              <span class="app-startup-skeleton app-startup-sidebar-row app-startup-sidebar-row-short"></span>
            </aside>
            <main class="app-startup-workspace">
              <section class="app-startup-workspace-surface">
                <span class="app-startup-skeleton app-startup-title"></span>
                <span class="app-startup-skeleton app-startup-subtitle"></span>
                <div class="app-startup-grid">
                  <span class="app-startup-skeleton app-startup-card"></span>
                  <span class="app-startup-skeleton app-startup-card"></span>
                </div>
                <span class="app-startup-skeleton app-startup-line"></span>
                <span class="app-startup-skeleton app-startup-line app-startup-line-medium"></span>
                <span class="app-startup-skeleton app-startup-line app-startup-line-short"></span>
              </section>
            </main>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
